name: Nigiro CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx6g -XX:MaxMetaspaceSize=1024m'"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Setup
        uses: ./.github/actions/setup
      - name: Test & Build APK (armeabi-v7a)
        env:
          KEY_ALIAS: "${{ secrets.KEY_ALIAS }}"
          KEY_PASSWORD: "${{ secrets.KEY_PASSWORD }}"
          KEY_STORE_PASSWORD: "${{ secrets.KEY_STORE_PASSWORD }}"
          SIGNING_KEY: "${{ secrets.SIGNING_KEY }}"
        run: |
          ./gradlew :app:testDefaultDebugUnitTest :app:assembleDefaultRelease --no-daemon --max-workers=2
          shopt -s nullglob
          for apk in app/build/outputs/apk/default/release/*.apk; do
            if [[ "$(basename "$apk")" != "Nigiro-release-armeabi-v7a.apk" ]]; then
              cp "$apk" "app/build/outputs/apk/default/release/Nigiro-release-armeabi-v7a.apk"
              break
            fi
          done
      - name: Upload Nigiro APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nigiro-apks
          path: app/build/outputs/apk/default/release/*.apk
          compression-level: 6
          retention-days: 14
