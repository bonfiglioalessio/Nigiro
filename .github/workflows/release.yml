name: Nigiro Release

on:
  push:
    tags:
      - v*

defaults:
  run:
    shell: bash

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx6g -XX:MaxMetaspaceSize=1024m'"
  TAG_NAME: ${{ github.ref_name }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Setup
        uses: ./.github/actions/setup
      - name: Test & Build Release APK
        env:
          KEY_ALIAS: "${{ secrets.KEY_ALIAS }}"
          KEY_PASSWORD: "${{ secrets.KEY_PASSWORD }}"
          KEY_STORE_PASSWORD: "${{ secrets.KEY_STORE_PASSWORD }}"
          SIGNING_KEY: "${{ secrets.SIGNING_KEY }}"
        run: |
          ./gradlew :app:testDefaultDebugUnitTest :app:assembleDefaultRelease --no-daemon --max-workers=2
          shopt -s nullglob
          for apk in app/build/outputs/apk/default/release/*.apk; do
            if [[ "$(basename "$apk")" != "Nigiro-release-armeabi-v7a.apk" ]]; then
              cp "$apk" "app/build/outputs/apk/default/release/Nigiro-release-armeabi-v7a.apk"
              break
            fi
          done
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ env.TAG_NAME }}" \
            --latest --title "Nigiro ${{ env.TAG_NAME }}" --verify-tag --generate-notes \
            app/build/outputs/apk/default/release/*.apk
