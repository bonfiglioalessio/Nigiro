// Classes from other modules (or generated code) that never change once built. Without this the
// Compose compiler treats them as unstable: with strong skipping a composable taking one is skipped
// only when the very same instance comes back, not an equal copy (a reloaded DTO, a re-parsed UUID).
java.util.UUID
java.time.LocalDateTime
java.time.LocalDate
java.time.Instant
java.time.Duration
kotlin.time.Duration
// Jellyfin SDK DTOs: data classes of vals
org.jellyfin.sdk.model.api.*
// Protobuf-lite preference messages (immutable once built) and the Kotlin preference helpers
com.github.damontecres.wholphin.preferences.*
// App models: data classes of vals
com.github.damontecres.wholphin.data.model.*
